<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boleta Electrónica - Llama la Optica</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/boleta.css">
</head>
<body>

    <div class="boleta-contenedor">
        <div class="boleta-cabecera">
            <h1>Llama la Optica</h1>
            <p>RUT: 76.543.210-K<br>Av. Los Lentes 123, Santiago</p>
            <p class="boleta-numero"><strong>BOLETA ELECTRÓNICA N° 10024</strong><br>Fecha: 07/09/2026</p>
        </div>

        <table class="boleta-tabla">
            <thead>
                <tr>
                    <th>Cant.</th>
                    <th>Descripción (Catálogo)</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="3">No hay productos cargados.</td>
                </tr>
            </tbody>
        </table>

        <div class="boleta-totales">
            <p><strong>TOTAL: $ 0</strong></p>
        </div>

        <div class="boleta-pie">
            <p>Gracias por tu compra en Llama la Optica.</p>
        </div>

        <button onclick="window.print()" class="btn-imprimir">🖨️ Guardar como PDF o Imprimir</button>
    </div>

    <script src="js/cargar_pedido.js"></script>
</body>
</html>
