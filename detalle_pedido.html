<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama la Optica MonkeyHandsomeStudios</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/pedido.css">

</head>
<body>
    <header>Llama la optica</header>

    <nav>
        <ul>
            <li><a href="index.html"></a></li>
            <li><a href="catalogo.html"></a></li>
            <li><a href="quienes_somos.html"></a></li>
            <li><a href="login.html"></a></li>
            <li><a href="contacto.html"></a></li>
            <li><a href="pedido.html"></a></li>
        </ul>
    </nav>
    
    <main class="contenedor-detalle">
        
        <!-- Encabezado del Detalle -->
        <header class="detalle-cabecera">
            <p class="estado-entregado">Entregado vie 31 de jul • 15:00 hrs</p>
            <h2>Llama la Optica - Sede Central</h2>
            
            <!-- Botón de Ruta / Seguimiento -->
            <a href="ruta.html" class="btn-ruta">Ver seguimiento en ruta</a>
        </header>

        <!-- Lista de Productos -->
        <section class="detalle-productos">
            <h3>Tu pedido</h3>
            
            <div class="item-producto">
                <img src="img/Lentes1.jpg" alt="Lentes" class="img-item">
                <div class="info-item">
                    <h4>Lentes de mujer metálicos + Estuche</h4>
                    <p class="precio-descuento">$ 26.291 <del>$ 29.990</del></p>
                </div>
                <div class="cantidad-item">1x</div>
            </div>
        </section>

        <!-- Desglose de Pago y Boleta -->
        <section class="detalle-pago">
            <h3>Tu pago</h3>
            
            <div class="fila-pago">
                <span>Productos</span>
                <span>$ 26.990</span>
            </div>
            <div class="fila-pago">
                <span>Envío</span>
                <span>$ 2990</span>
            </div>
            <div class="fila-pago total">
                <strong>Total</strong>
                <strong>$ 29.980</strong>
            </div>

            <!-- Botón de Boleta generada -->
            <div class="descarga-boleta">
                <a href="boleta.html" target="_blank" class="btn-boleta">
                    📄 Descargar el detalle del costo del servicio (Boleta)
                </a>
            </div>
            
        </section>

    </main>
</body>
</html>
