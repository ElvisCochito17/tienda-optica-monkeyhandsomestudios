<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Llama la optica</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <nav>
        <div class="marca">
            <img src="img/logo.png" alt="Logo de la tienda" class="logo">
            <span>Llama la Optica</span>
        </div>  
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="catalogo.html">Catalogo</a></li>
            <li><a href="quienes_somos.html">Quienes Somos</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="pedido.html">Pedidos</a></li>
            <li><a href="registro.html">Registro</a></li>
            <li>
                <a href="contacto.html" class="btn-carrito-nav">
                    🛒 Carrito <span id="contador-carrito" class="badge">0</span>
                </a>
            </li>
        </ul>
    </nav>
    <main>
        <div class="Bienvenida">
            <h1>Inicia Sesión en tu Cuenta</h1>
            <p>Por favor ingresa tus credenciales para acceder.</p>
        </div>
        
        <section>
            <div class="Formulario-contenedor">
                <form action="" method="post">
                    <table>
                        <tr>
                            <td>Correo:</td>
                            <td>
                                <input type="email" name="email" id="txtEmailLogin" required placeholder="ingrese email">
                            </td>
                        </tr>
                        <tr>
                            <td>Contraseña:</td>
                            <td>
                                <input type="password" name="password" id="txtPasswordLogin" required placeholder="ingrese contraseña">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" class="fila-botones">
                                <input type="reset" value="Limpiar" class="btn-limpiar">
                                <input type="submit" value="Ingresar" class="btn-enviar">
                            </td>
                        </tr>
                    </table>
                </form>
            </div>
        </section>
    </main>
    <script src="js/carrito.js"></script>

</body>
</html>
